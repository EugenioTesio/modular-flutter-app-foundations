name: foundations_example
description: Runnable example of the Foundations contracts.
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  foundations:
    path: ../
  # The host picks the router; micro apps only see the route contract.
  go_router: ^18.1.4
  # The host picks the state-management adapter; Foundations never does.
  switchable_state_riverpod: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
