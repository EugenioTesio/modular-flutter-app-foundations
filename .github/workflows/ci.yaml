name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Analyze and test every package in this repository separately.
  verify:
    name: Verify ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - .
          - example
          - packages/design_system
          - packages/design_system/example
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze (must report 0 issues)
        run: flutter analyze
      - name: Test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No tests in ${{ matrix.package }} yet."
          fi

  # Coverage for the Foundations package itself. The 90% gate is added in T091 and T092.
  coverage:
    name: Coverage (foundations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Test with coverage
        run: |
          if [ -d test ]; then
            flutter test --coverage
          else
            echo "No tests yet."
          fi
