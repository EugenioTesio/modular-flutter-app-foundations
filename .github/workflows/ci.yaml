name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Analyze and test every package in this repository separately.
  verify:
    name: Verify ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - .
          - example
          - packages/design_system
          - packages/design_system/example
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze (must report 0 issues)
        run: flutter analyze
      # dart doc exits 0 on warnings, so the summary line is checked too.
      - name: Check API docs (0 dartdoc warnings and 0 errors)
        if: matrix.package == '.' || matrix.package == 'packages/design_system'
        run: |
          dart doc --dry-run 2>&1 | tee dartdoc.log
          grep -q 'Found 0 warnings and 0 errors' dartdoc.log
      - name: Test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No tests in ${{ matrix.package }} yet."
          fi

  # Coverage gate for the Foundations package itself: at least 90% of the
  # concrete code under lib/ (quickstart.md V7).
  coverage:
    name: Coverage (foundations)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the report post its coverage table on the pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Test with coverage
        run: flutter test --coverage
      # The report action runs lcov and genhtml, which the runner lacks.
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install --yes lcov
      # Reads coverage/lcov.info directly; it lists only the files under
      # lib/. Fails when line coverage is below 90%, comments the coverage
      # table on the pull request, and uploads an HTML report.
      - name: Report and check coverage (at least 90% of lib/)
        uses: zgosalvez/github-actions-report-lcov@7e6043a0e3ae37bc6e45291401ddea852fc750e5 # v7.2.3
        with:
          coverage-files: coverage/lcov.info
          minimum-coverage: 90
          artifact-name: coverage-report
          # Pull requests from forks get a read-only token, so they skip the
          # comment instead of failing.
          github-token: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.GITHUB_TOKEN || '' }}
          update-comment: true
          thresholds: '95,90'
